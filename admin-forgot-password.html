<!DOCTYPE html>
<html lang="en">
<head>
  <title>Best Mediterranean Restaurant in Red Deer | Olives Mediterranean Grill</title>
  <meta name="description"
content="Reset your admin password securely for the Olives Mediterranean Grill management dashboard and regain access to restaurant operations and administration tools.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Monoton&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Miss+Fajardose&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
  <link rel="stylesheet" href="css/animate.css">
  <link rel="stylesheet" href="css/owl.carousel.min.css">
  <link rel="stylesheet" href="css/owl.theme.default.min.css">
  <link rel="stylesheet" href="css/magnific-popup.css">
  <link rel="stylesheet" href="css/aos.css">
  <link rel="stylesheet" href="css/ionicons.min.css">
  <link rel="stylesheet" href="css/bootstrap-datepicker.css">
  <link rel="stylesheet" href="css/jquery.timepicker.css">
  <link rel="stylesheet" href="css/flaticon.css">
  <link rel="stylesheet" href="css/icomoon.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background: #1a1a1a; }
    .admin-forgot-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6rem 0; background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); position: relative; overflow: hidden; }
    .admin-forgot-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url('images/bg_3.jpg') center/cover no-repeat; opacity: 0.08; z-index: 0; }
    .admin-card { background: rgba(255, 255, 255, 0.98); border-radius: 25px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; position: relative; z-index: 1; border: 1px solid rgba(196, 154, 108, 0.2); max-width: 500px; margin: 0 auto; }
    .admin-header { background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); padding: 2rem; text-align: center; border-bottom: 3px solid #7A9A01; }
    .admin-header h3 { color: #7A9A01; font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }
    .admin-header p { color: rgba(255, 255, 255, 0.7); margin-bottom: 0; font-size: 0.9rem; }
    .admin-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #7A9A01 0%, #7A9A01 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; }
    .admin-icon span { font-size: 40px; color: #fff; }
    .admin-body { padding: 2.5rem; }
    .form-group { margin-bottom: 1.5rem; position: relative; }
    .form-control { width: 100%; padding: 12px 20px; font-size: 1rem; border: 1px solid #e0e0e0; border-radius: 10px; transition: all 0.3s; background: #fafafa; }
    .form-control:focus { border-color: #7A9A01; outline: none; box-shadow: 0 0 0 3px rgba(196,154,108,0.1); background: #fff; }
    .btn-submit { background: linear-gradient(135deg, #7A9A01 0%, #7A9A01 100%); border: none; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 10px; width: 100%; color: #fff; cursor: pointer; transition: all 0.3s; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(160,110,60,0.3); }
    .alert-message { display: none; padding: 12px 20px; border-radius: 10px; margin-bottom: 1.5rem; text-align: center; }
    .alert-danger { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
    .alert-success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
    .alert-info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
    .otp-inputs { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
    .otp-input { width: 50px; height: 50px; text-align: center; font-size: 24px; border: 2px solid #e0e0e0; border-radius: 10px; background: #fff; }
    .otp-input:focus { border-color: #7A9A01; outline: none; }
    .timer { text-align: center; margin-top: 10px; color: #7A9A01; font-weight: bold; }
    .resend-link { text-align: center; margin-top: 15px; }
    .resend-link a { color: #7A9A01; text-decoration: none; cursor: pointer; }
    .resend-link a:hover { text-decoration: underline; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #666; text-decoration: none; font-size: 0.9rem; }
    .back-link a:hover { color: #7A9A01; }
    .step { display: none; }
    .step.active { display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.6s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <section class="admin-forgot-section">
    <div class="container">
      <div class="admin-card">
        <div class="admin-header">
          <div class="admin-icon"><span class="icon-lock"></span></div>
          <h3>Admin Password Reset</h3>
          <p>Secure Access Recovery System</p>
        </div>
        <div class="admin-body">
          <div id="alertMessage" class="alert-message"></div>

          <!-- Step 1: Enter Email -->
          <div id="step1" class="step active">
            <form id="forgotForm">
              <div class="form-group">
                <input type="email" id="adminEmail" class="form-control" placeholder="Admin Email Address" required>
              </div>
              <button type="submit" class="btn-submit" id="sendOtpBtn">Send Reset OTP</button>
            </form>
            <div class="back-link">
              <a href="adminlogin.html">← Back to Admin Login</a>
            </div>
          </div>

          <!-- Step 2: Enter OTP -->
          <div id="step2" class="step">
            <p class="text-center mb-3">Enter the 6-digit code sent to <strong id="adminEmailDisplay"></strong></p>
            <div class="otp-inputs">
              <input type="text" maxlength="1" class="otp-input" id="otp1" onkeyup="moveToNext(this, 'otp2')">
              <input type="text" maxlength="1" class="otp-input" id="otp2" onkeyup="moveToNext(this, 'otp3')">
              <input type="text" maxlength="1" class="otp-input" id="otp3" onkeyup="moveToNext(this, 'otp4')">
              <input type="text" maxlength="1" class="otp-input" id="otp4" onkeyup="moveToNext(this, 'otp5')">
              <input type="text" maxlength="1" class="otp-input" id="otp5" onkeyup="moveToNext(this, 'otp6')">
              <input type="text" maxlength="1" class="otp-input" id="otp6" onkeyup="moveToNext(this, null)">
            </div>
            <div class="timer" id="timer">Time remaining: 10:00</div>
            <div class="resend-link"><a onclick="resendOTP()">Resend OTP</a></div>
            <button class="btn-submit mt-3" onclick="verifyOTP()">Verify OTP</button>
            <div class="back-link mt-3"><a href="adminlogin.html">← Back to Admin Login</a></div>
          </div>

          <!-- Step 3: Reset Password -->
          <div id="step3" class="step">
            <form id="resetPasswordForm">
              <div class="form-group">
                <input type="password" id="newPassword" class="form-control" placeholder="New Password" required>
              </div>
              <div class="form-group">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm New Password" required>
              </div>
              <button type="submit" class="btn-submit">Reset Admin Password</button>
            </form>
            <div class="back-link mt-3"><a href="adminlogin.html">← Back to Admin Login</a></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="ftco-footer ftco-bg-dark ftco-section" style="padding: 2rem 0;">
    <div class="container-fluid px-md-5 px-3">
      <div class="row"><div class="col-md-12 text-center">
        <p style="margin-bottom: 0;">Copyright &copy;<script>document.write(new Date().getFullYear());</script> All rights reserved | Olives Mediterranean Grill Admin Panel</p>
      </div></div>
    </div>
  </footer>

  <script src="js/jquery.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>

  <script>
    const API_BASE_URL = 'https://restaurant-app-ru0u.onrender.com';
    let currentEmail = '';
    let timerInterval = null;
    let timeLeft = 600;

    function showAlert(type, message) {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.className = `alert-message alert-${type}`;
      alertDiv.innerHTML = message;
      alertDiv.style.display = 'block';
      setTimeout(() => { alertDiv.style.display = 'none'; }, 5000);
    }

    function moveToNext(current, nextId) {
      if (current.value.length === 1 && nextId) {
        document.getElementById(nextId).focus();
      }
    }

    function getOTPValue() {
      return document.getElementById('otp1').value +
             document.getElementById('otp2').value +
             document.getElementById('otp3').value +
             document.getElementById('otp4').value +
             document.getElementById('otp5').value +
             document.getElementById('otp6').value;
    }

    function clearOTPFields() {
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`otp${i}`).value = '';
      }
      document.getElementById('otp1').focus();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timeLeft = 600;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer').innerHTML = 'OTP expired. Please request a new one.';
          document.getElementById('timer').style.color = '#dc3545';
        } else {
          timeLeft--;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timer').innerHTML = `Time remaining: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // Step 1: Send OTP to Admin Email
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      
      if (!email) {
        showAlert('danger', 'Please enter your admin email address');
        return;
      }
      
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        showAlert('danger', 'Please enter a valid email address');
        return;
      }
      
      const submitBtn = document.getElementById('sendOtpBtn');
      submitBtn.innerHTML = '<span class="spinner"></span> Sending...';
      submitBtn.disabled = true;
      
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/admin-forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          currentEmail = email;
          document.getElementById('adminEmailDisplay').textContent = email;
          showAlert('success', 'OTP sent to your admin email!');
          document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
          document.getElementById('step2').classList.add('active');
          clearOTPFields();
          startTimer();
        } else {
          showAlert('danger', data.message || 'Failed to send OTP. Make sure you have admin privileges.');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('danger', 'Server error. Please try again.');
      } finally {
        submitBtn.innerHTML = 'Send Reset OTP';
        submitBtn.disabled = false;
      }
    });
    
    // Step 2: Verify OTP
    async function verifyOTP() {
      const otp = getOTPValue();
      if (otp.length !== 6) {
        showAlert('danger', 'Please enter the 6-digit OTP');
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/admin-verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, otp })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showAlert('success', 'OTP verified! Set your new admin password.');
          if (timerInterval) clearInterval(timerInterval);
          document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
          document.getElementById('step3').classList.add('active');
        } else {
          showAlert('danger', data.message || 'Invalid OTP');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('danger', 'Server error. Please try again.');
      }
    }
    
    // Resend OTP
    async function resendOTP() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/admin-forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showAlert('success', 'New OTP sent to your email!');
          clearOTPFields();
          startTimer();
        } else {
          showAlert('danger', data.message || 'Failed to resend OTP');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('danger', 'Server error. Please try again.');
      }
    }
    
    // Step 3: Reset Admin Password
    document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const otp = getOTPValue();
      
      if (!newPassword || !confirmPassword) {
        showAlert('danger', 'Please enter new password');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showAlert('danger', 'Passwords do not match');
        return;
      }
      
      if (newPassword.length < 6) {
        showAlert('danger', 'Password must be at least 6 characters');
        return;
      }
      
      const submitBtn = this.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<span class="spinner"></span> Resetting...';
      submitBtn.disabled = true;
      
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/admin-reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, otp, newPassword, confirmPassword })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showAlert('success', 'Admin password reset successfully! Redirecting to login...');
          setTimeout(() => {
            window.location.href = 'adminlogin.html';
          }, 2000);
        } else {
          showAlert('danger', data.message || 'Failed to reset password');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('danger', 'Server error. Please try again.');
      } finally {
        submitBtn.innerHTML = 'Reset Admin Password';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
