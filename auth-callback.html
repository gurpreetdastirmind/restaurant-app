<!DOCTYPE html>
<html>
<head>
  <title>Best Mediterranean Restaurant in Red Deer | Olives Mediterranean Grill</title>
  <meta name="description"
content="Secure authentication processing page for Olives Mediterranean Grill. Completing login verification and redirecting users safely to their account or dashboard.">
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #7A9A01 0%, #ff6b23 100%);
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #7A9A01;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Logging you in...</h2>
    <div class="spinner"></div>
    <p>Please wait, redirecting to the app...</p>
  </div>
  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const userId = urlParams.get('userId');
    const firstName = urlParams.get('firstName');
    const lastName = urlParams.get('lastName');
    const email = urlParams.get('email');
    const role = urlParams.get('role');
    
    if (token) {
      // Store user data in localStorage
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify({
        _id: userId,
        firstName: firstName,
        lastName: lastName,
        email: email,
        role: role
      }));
      
      // Redirect to home page
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    } else {
      // Error occurred
      setTimeout(() => {
        window.location.href = 'login.html?error=google_login_failed';
      }, 2000);
    }
  </script>
</body>
</html>
